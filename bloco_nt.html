<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bloco de Notas</title>
    <link rel="stylesheet" href="bloco_nt.css">
</head>
<body>
    <div class="voltar">
        <a href="index.html">VOLTAR</a>
    </div><br><br>
    
    <div class="container">
        <h1>📝 Bloco de Notas</h1>
        <textarea id="nota" placeholder="Digite suas anotações aqui... Obs: Só aparecerá no seu dispositivo, não é público."></textarea>
        <button id="limpar">Limpar Tudo</button>
        <p id="status">Salvo automaticamente</p>
    </div>

    <script src="bloco_nt.js"></script>
</body>
</html>

<!--Como testar:
Crie uma pasta no seu computador.
Crie os três arquivos (index.html, style.css, script.js) dentro dela com os códigos acima.
Abra o arquivo index.html no seu navegador (Chrome, Firefox, etc).
Digite algo, feche a aba e abra de novo. O texto ainda estará lá!
Explicação rápida do localStorage:
O localStorage é como uma pequena caixa dentro do navegador do usuário onde você pode guardar textos.

setItem('chave', 'valor'): Guarda a informação.
getItem('chave'): Recupera a informação.
removeItem('chave'): Apaga a informação.
Se quiser melhorar depois, você pode adicionar opções para mudar a cor do fundo ou o tamanho da fonte!-->
